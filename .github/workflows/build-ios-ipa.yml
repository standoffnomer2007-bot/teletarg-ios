name: Build TeleTarg iOS (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack TeleTarg_Full_iOS.zip if present
        run: |
          if [ -f "TeleTarg_Full_iOS.zip" ]; then
            unzip -o TeleTarg_Full_iOS.zip -d unpacked
            cp -R unpacked/TeleTarg/* .
          fi

      - name: Verify project.yml exists
        run: |
          if [ ! -f "project.yml" ]; then
            echo "Upload TeleTarg_Full_iOS.zip to main branch to trigger build."
            exit 0
          fi

      - name: Install XcodeGen
        if: hashFiles('project.yml') != '' || hashFiles('TeleTarg_Full_iOS.zip') != ''
        run: brew install xcodegen

      - name: Generate Xcode Project
        if: hashFiles('project.yml') != '' || hashFiles('TeleTarg_Full_iOS.zip') != ''
        run: xcodegen generate

      - name: Build Unsigned Release .app
        if: hashFiles('project.yml') != '' || hashFiles('TeleTarg_Full_iOS.zip') != ''
        run: |
          xcodebuild \
            -project TeleTarg.xcodeproj \
            -scheme TeleTarg \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TeleTarg.ipa
        if: hashFiles('project.yml') != '' || hashFiles('TeleTarg_Full_iOS.zip') != ''
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TeleTarg.app Payload/
          zip -r TeleTarg.ipa Payload

      - name: Upload TeleTarg.ipa Artifact
        if: hashFiles('project.yml') != '' || hashFiles('TeleTarg_Full_iOS.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: TeleTarg-iOS-IPA
          path: TeleTarg.ipa
